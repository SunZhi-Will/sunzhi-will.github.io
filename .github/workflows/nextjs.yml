# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [main, master]  # 支援 main 和 master 分支
    paths:
      - 'content/blog/**'  # 當 blog 內容變更時觸發
      - 'public/blog/**'   # 當 blog 圖片變更時觸發
      - 'app/**'           # 當應用程式代碼變更時觸發
      - 'components/**'    # 當組件變更時觸發
      - 'package.json'     # 當依賴變更時觸發
      - 'package-lock.json'
      - 'next.config.ts'
      - 'scripts/**'       # 當腳本變更時觸發
      - 'data/**'          # 專案、活動等網站資料
      - 'lib/**'
      - 'types/**'
      - 'public/**'        # 圖片、OG 圖、LOGO 等靜態檔
      - 'tailwind.config.ts'
      - 'postcss.config.mjs'
      - '.github/workflows/nextjs.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Trigger when daily-ai-report workflow completes
  workflow_run:
    workflows: ["Generate Daily AI Report"]
    types:
      - completed
    branches: [main, master]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    # 如果是由 workflow_run 觸發，只在前一個 workflow 成功時執行
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
        # 不要設 static_site_generator: next。這個選項找不到 next.config.js/.mjs/.cjs（不認 .ts）時，
        # 會自己建一份預設的 next.config.js，而 Next 會優先讀它，next.config.ts 就被整個忽略，
        # 連 transpilePackages 都不會生效，文章頁預渲染因此報 useState 錯誤。
        # next.config.ts 已經有 output: 'export' 與 images.unoptimized，不需要它來注入。
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Copy blog images
        run: |
          if [ -f "scripts/copy-blog-images.js" ]; then
            node scripts/copy-blog-images.js
          fi
      - name: Generate OG image
        if: ${{ hashFiles('scripts/generate-og-image.js') != '' }}
        run: node scripts/generate-og-image.js
      - name: Build with Next.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
